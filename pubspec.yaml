name: aurasync
description: Offline sensory and meltdown regulation app for children with ASD.
publish_to: none
version: 1.0.1+2

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  ffi: ^2.1.2
  web: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  shaders:
    - shaders/bioluminescent_tunnel.frag
    - shaders/classroom_bubbles.frag
    - shaders/oled_lanterns.frag
    - shaders/breathing_orb.frag
    - shaders/crystal_polygons.frag
    - shaders/starfield_3d.frag
    - shaders/aurora_ribbons.frag
    - shaders/mandala_polygons.frag
