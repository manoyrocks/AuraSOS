# AuraSOS PWA - nginx server block. Serve the contents of build/web.
# TLS is required for the service worker (offline + install); terminate HTTPS here or in front.
server {
    listen 443 ssl http2;
    server_name aurasos.example.com;          # <- your domain
    root /var/www/aurasos;                    # <- the contents of build/web
    index index.html;

    # wasm must be served with the right type or CanvasKit will not start
    types { application/wasm wasm; }
    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Files are not fingerprinted: always revalidate (the service worker does the real caching).
    add_header Cache-Control "no-cache" always;
    location /icons/ { add_header Cache-Control "public, max-age=604800" always; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
